<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>ورود ادمین</title>

    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link href="./css/style.css" rel="stylesheet" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 overflow-hidden">

    <!-- عنصر ویروس امنیتی (که قرار است نابود شود) -->
    <div class="virus-element" id="virus">
        <i class="bi bi-bug-fill"></i>
    </div>

    <!-- حلقه موج ضربه ناشی از برخورد باکس -->
    <div class="shockwave" id="shockwave"></div>

    <!-- باکس ورود اصلی (با انیمیشن سقوط سنگین) -->
    <div class="login-card p-4 p-sm-5 rounded-4 shadow-lg text-center" id="loginCard">
        
        <!-- هدر ساده -->
        <div class="mb-4">
            <div class="icon-box mb-3 mx-auto rounded-circle d-flex align-items-center justify-content-center">
                <i class="bi bi-shield-check text-primary fs-2"></i>
            </div>
            <h4 class="fw-bold text-white m-0">ورود ادمین</h4>
            <small class="text-white-50">سیستم ایمن است</small>
        </div>

        <!-- فرم ساده -->
        <form id="loginForm">
            <div class="form-floating mb-3">
                <input class="form-control input-style text-white" id="inputPassword" type="password" placeholder="رمز عبور" required />
                <label for="inputPassword">رمز عبور</label>
            </div>

            <!-- پیام خطا -->
            <div id="spanError" class="alert alert-danger py-2 fs-7 d-none mb-3" role="alert">
                رمز عبور صحیح نمی‌باشد
            </div>

            <!-- دکمه ورود -->
            <button id="btn" class="btn btn-primary w-100 py-3 fw-bold btn-custom rounded-3" type="submit">
                ورود به پنل
            </button>
        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
