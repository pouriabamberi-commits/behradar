<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود استاد | پنل مدیریت</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="css/admin.css" rel="stylesheet"></head><body class="bg-info"><div class="container py-5"><div class="row justify-content-center g-4"><div class="col-lg-5"><div class="card shadow-lg border-0 rounded-4"><div class="card-body p-4 p-lg-5"><div class="text-center mb-4"><div class="sidebar-logo mx-auto mb-3"><i class="fa-solid fa-graduation-cap"></i></div><h2 class="fw-bold">ورود استاد</h2><p class="text-muted small">برای ورود به داشبورد شماره موبایل و رمز عبور را وارد کنید.</p></div><form id="adminLoginForm"><div class="mb-3"><label class="form-label">شماره موبایل</label><input id="loginPhone" class="form-control" dir="ltr" placeholder="09000000000" required></div><div class="mb-3"><label class="form-label">رمز عبور</label><input id="inputPassword" type="password" class="form-control" dir="ltr" placeholder="رمز عبور" required></div><div id="loginError" class="alert alert-danger d-none py-2 small"></div><button class="btn btn-dark w-100 py-2" type="submit"><i class="fa-solid fa-right-to-bracket"></i> ورود به داشبورد</button></form><div class="text-center mt-4"><button class="btn btn-link text-decoration-none" data-bs-toggle="collapse" data-bs-target="#requestBox">درخواست ورود استاد جدید</button></div><div id="requestBox" class="collapse"><div class="border-top pt-4"><h6 class="fw-bold">درخواست دسترسی</h6><p class="text-muted small">نام، شماره و رمز دلخواه خود را ثبت کنید؛ یک استاد دارای دسترسی درخواست شما را بررسی می‌کند.</p><form id="accessRequestForm"><input id="requestName" class="form-control mb-2" placeholder="نام و نام خانوادگی" required><input id="requestPhone" class="form-control mb-2" dir="ltr" placeholder="شماره موبایل" required><input id="requestPassword" type="password" class="form-control mb-2" dir="ltr" placeholder="رمز عبور دلخواه" required><button class="btn btn-outline-dark w-100" type="submit">ارسال درخواست</button></form><div id="requestResult" class="small mt-2"></div></div></div><div class="text-center mt-4 small text-muted">رمز اولیه استاد اصلی: <b>123</b> — شماره: <b dir="ltr">09000000000</b></div></div></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/login.js"></script></body></html>
