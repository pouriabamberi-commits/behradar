<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>تنظیمات</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <nav class="navbar admin-navbar">
      <div class="container-fluid">
        <div>
          <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fa-solid fa-bars"></i></button
          ><a class="navbar-brand" href="dashboard.html">پنل مدیریت</a>
        </div>
        <div class="admin-user">
          <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="user-info">
            <strong data-admin-name>استاد</strong><small>استاد</small>
          </div>
        </div>
      </div>
    </nav>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div>
            <h5>پنل مدیریت</h5>
            <span>تنظیمات</span>
          </div>
        </div>
        <div class="sidebar-menu">
          <a href="dashboard.html" class="menu-item"
            ><i class="fa-solid fa-house"></i>داشبورد</a
          ><a href="students.html" class="menu-item"
            ><i class="fa-solid fa-user-graduate"></i>زبان‌آموزان</a
          ><a href="articles.html" class="menu-item"
            ><i class="fa-solid fa-newspaper"></i>مقالات</a
          ><a href="downloads-manage.html" class="menu-item"
            ><i class="fa-solid fa-folder-open"></i>مدیریت فایل‌ها</a
          ><a href="messages.html" class="menu-item"
            ><i class="fa-solid fa-envelope"></i>پیام‌ها</a
          ><a href="profile.html" class="menu-item"
            ><i class="fa-solid fa-user"></i>پروفایل</a
          ><a href="settings.html" class="menu-item active"
            ><i class="fa-solid fa-gear"></i>تنظیمات</a
          >
          <div class="sidebar-divider"></div>
          <a href="#" data-logout class="menu-item logout"
            ><i class="fa-solid fa-right-from-bracket"></i>خروج</a
          >
        </div>
      </aside>
      <main class="main-content" id="mainContent">
        <div class="page-header">
          <h1>تنظیمات داشبورد</h1>
          <p>حالت نمایش داشبورد را انتخاب کنید.</p>
        </div>
        <div class="admin-page-card">
          <div class="row g-3">
            <div class="col-md-6">
              <button
                class="btn btn-outline-dark w-100 py-3"
                data-theme="light"
              >
                <i class="fa-solid fa-sun"></i> حالت روشن
              </button>
            </div>
            <div class="col-md-6">
              <button class="btn btn-dark w-100 py-3" data-theme="dark">
                <i class="fa-solid fa-moon"></i> حالت تاریک
              </button>
            </div>
          </div>
          <div id="themeResult" class="small text-success mt-3"></div>
        </div>
      </main>
    </div>
    <script src="js/admin.js"></script>
    <script>
      document.querySelectorAll("[data-theme]").forEach(function (b) {
        b.addEventListener("click", function () {
          fetch("/api/profile/theme", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ theme: b.dataset.theme }),
          })
            .then((r) => r.json())
            .then(function (x) {
              document.body.classList.toggle("dark-mode", x.theme === "dark");
              document.getElementById("themeResult").textContent =
                "تنظیمات ذخیره شد.";
            });
        });
      });
    </script>
  </body>
</html>
