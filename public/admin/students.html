<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>زبان‌آموزان</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <nav class="navbar admin-navbar">
      <div class="container-fluid">
        <div>
          <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fa-solid fa-bars"></i></button
          ><a class="navbar-brand" href="dashboard.html">پنل مدیریت</a>
        </div>
        <div class="admin-user">
          <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="user-info">
            <strong data-admin-name>استاد</strong><small>استاد</small>
          </div>
        </div>
      </div>
    </nav>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div>
            <h5>پنل مدیریت</h5>
            <span>مدیریت آموزشگاه</span>
          </div>
        </div>
        <div class="sidebar-menu">
          <a href="dashboard.html" class="menu-item"
            ><i class="fa-solid fa-house"></i>داشبورد</a
          ><a href="students.html" class="menu-item active"
            ><i class="fa-solid fa-user-graduate"></i>زبان‌آموزان</a
          ><a href="articles.html" class="menu-item"
            ><i class="fa-solid fa-newspaper"></i>مقالات</a
          ><a href="downloads-manage.html" class="menu-item"
            ><i class="fa-solid fa-folder-open"></i>مدیریت فایل‌ها</a
          ><a href="messages.html" class="menu-item"
            ><i class="fa-solid fa-envelope"></i>پیام‌ها</a
          ><a href="profile.html" class="menu-item"
            ><i class="fa-solid fa-user"></i>پروفایل</a
          ><a href="settings.html" class="menu-item"
            ><i class="fa-solid fa-gear"></i>تنظیمات</a
          >
          <div class="sidebar-divider"></div>
          <a href="#" data-logout class="menu-item logout"
            ><i class="fa-solid fa-right-from-bracket"></i>خروج</a
          >
        </div>
      </aside>
      <main class="main-content" id="mainContent">
        <div class="page-header">
          <h1>زبان‌آموزان ثبت‌نام‌شده</h1>
          <p>
            نام و نام خانوادگی، شماره موبایل و تاریخ عضویت کاربران را مرتب
            ببینید.
          </p>
        </div>
        <div class="admin-page-card mb-3">
          <input
            id="studentSearch"
            class="form-control"
            placeholder="جستجو بر اساس نام یا شماره موبایل..."
          />
        </div>
        <div class="dashboard-card">
          <div class="table-responsive">
            <table class="table admin-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>نام و نام خانوادگی</th>
                  <th>شماره موبایل</th>
                  <th>تاریخ ثبت‌نام</th>
                  <th>وضعیت</th>
                </tr>
              </thead>
              <tbody id="studentsTable"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <script src="js/admin.js"></script>
    <script>
      (function () {
        var data = [];
        var tb = document.getElementById("studentsTable");
        function esc(v) {
          return String(v || "").replace(/[&<>"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
        function render() {
          var q = document.getElementById("studentSearch").value.toLowerCase();
          var rows = data.filter(function (s) {
            return (
              s.full_name.toLowerCase().indexOf(q) >= 0 ||
              s.phone.indexOf(q) >= 0
            );
          });
          tb.innerHTML =
            rows
              .map(function (s, i) {
                return (
                  "<tr><td>" +
                  (i + 1) +
                  '</td><td><div class="table-user"><div class="mini-avatar">' +
                  esc(s.full_name.charAt(0)) +
                  "</div><strong>" +
                  esc(s.full_name) +
                  '</strong></div></td><td dir="ltr">' +
                  esc(s.phone) +
                  "</td><td>" +
                  new Date(s.created_at).toLocaleDateString("fa-IR") +
                  '</td><td><span class="status active">فعال</span></td></tr>'
                );
              })
              .join("") ||
            '<tr><td colspan="5" class="text-center text-muted py-4">کاربری پیدا نشد.</td></tr>';
        }
        fetch("/api/students")
          .then(function (r) {
            return r.json();
          })
          .then(function (x) {
            data = x;
            render();
          });
        document
          .getElementById("studentSearch")
          .addEventListener("input", render);
      })();
    </script>
  </body>
</html>
