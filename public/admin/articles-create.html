<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>افزودن مقاله</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="css/admin.css">

</head>


<body class="article-create-page">


    <main class="article-create-container">


        <!-- HEADER -->

        <div class="article-create-header">

            <div>

                <h1>
                    <i class="fas fa-pen-to-square"></i>
                    افزودن مقاله
                </h1>

                <p>
                    یک مقاله جدید برای سایت ایجاد کنید.
                </p>

            </div>


            <a
                href="articles.html"
                class="btn btn-outline-secondary">

                <i class="fas fa-arrow-right"></i>
                بازگشت به مقالات

            </a>

        </div>



        <!-- FORM -->

        <div class="article-create-card">

            <form id="articleCreateForm">


                <!-- اطلاعات اصلی -->

                <div class="form-section">

                    <h5>
                        <i class="fas fa-circle-info"></i>
                        اطلاعات اصلی
                    </h5>


                    <div class="mb-4">

                        <label
                            for="articleTitle"
                            class="form-label">

                            عنوان مقاله

                        </label>

                        <input
                            type="text"
                            id="articleTitle"
                            class="form-control"
                            placeholder="عنوان مقاله را وارد کنید..."
                            required>

                    </div>


                    <div class="row">


                        <div class="col-md-6 mb-4">

                            <label
                                for="articleCategory"
                                class="form-label">

                                دسته‌بندی

                            </label>

                            <select
                                id="articleCategory"
                                class="form-select"
                                required>

                                <option value="">
                                    انتخاب دسته‌بندی
                                </option>

                                <option value="grammar">
                                    گرامر
                                </option>

                                <option value="vocabulary">
                                    لغات
                                </option>

                                <option value="conversation">
                                    مکالمه
                                </option>

                                <option value="listening">
                                    Listening
                                </option>

                                <option value="general">
                                    آموزش عمومی
                                </option>

                            </select>

                        </div>


                        <div class="col-md-6 mb-4">

                            <label
                                for="articleStatus"
                                class="form-label">

                                وضعیت مقاله

                            </label>

                            <select
                                id="articleStatus"
                                class="form-select">

                                <option value="published">
                                    منتشر شود
                                </option><option value="draft">
                                    ذخیره به عنوان پیش‌نویس
                                </option>

                            </select>

                        </div>


                    </div>

                </div>



                <!-- خلاصه -->

                <div class="form-section">

                    <h5>
                        <i class="fas fa-align-right"></i>
                        خلاصه مقاله
                    </h5>


                    <label
                        for="articleSummary"
                        class="form-label">

                        خلاصه

                    </label>


                    <textarea
                        id="articleSummary"
                        class="form-control"
                        rows="4"
                        placeholder="خلاصه کوتاهی از مقاله بنویسید..."
                        required></textarea>

                </div>



                <!-- متن مقاله -->

                <div class="form-section">

                    <h5>
                        <i class="fas fa-file-lines"></i>
                        محتوای مقاله
                    </h5>


                    <label
                        for="articleContent"
                        class="form-label">

                        متن مقاله

                    </label>


                    <textarea
                        id="articleContent"
                        class="form-control article-content-input"
                        rows="14"
                        placeholder="محتوای کامل مقاله را بنویسید..."
                        required></textarea>

                </div>



                <!-- تصویر -->

                <div class="form-section">

                    <h5>
                        <i class="fas fa-image"></i>
                        تصویر مقاله
                    </h5>


                    <label
                        for="articleImage"
                        class="form-label">

                        تصویر شاخص

                    </label>


                    <input
                        type="file"
                        id="articleImage"
                        class="form-control"
                        accept="image/*">

                    <div class="form-text">
                        تصویر اصلی مقاله را انتخاب کنید.
                    </div>

                </div>



                <!-- BUTTONS -->

                <div class="article-form-actions">


                    <a
                        href="articles.html"
                        class="btn btn-light">

                        انصراف

                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        <i class="fas fa-save"></i>
                        ذخیره مقاله

                    </button>


                </div>


            </form>

        </div>


    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

</body>

</html>
