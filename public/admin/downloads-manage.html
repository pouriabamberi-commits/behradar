<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مدیریت فایل‌ها</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <nav class="navbar admin-navbar">
      <div class="container-fluid">
        <div>
          <button class="sidebar-toggle" id="sidebarToggle">
            <i class="fa-solid fa-bars"></i></button
          ><a class="navbar-brand" href="dashboard.html">پنل مدیریت</a>
        </div>
        <div class="admin-user">
          <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
          <div class="user-info">
            <strong data-admin-name>استاد</strong><small>استاد</small>
          </div>
        </div>
      </div>
    </nav>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div>
            <h5>پنل مدیریت</h5>
            <span>مرکز فایل‌ها</span>
          </div>
        </div>
        <div class="sidebar-menu">
          <a href="dashboard.html" class="menu-item"
            ><i class="fa-solid fa-house"></i>داشبورد</a
          ><a href="students.html" class="menu-item"
            ><i class="fa-solid fa-user-graduate"></i>زبان‌آموزان</a
          ><a href="articles.html" class="menu-item"
            ><i class="fa-solid fa-newspaper"></i>مقالات</a
          ><a href="downloads-manage.html" class="menu-item active"
            ><i class="fa-solid fa-folder-open"></i>مدیریت فایل‌ها</a
          ><a href="messages.html" class="menu-item"
            ><i class="fa-solid fa-envelope"></i>پیام‌ها</a
          ><a href="profile.html" class="menu-item"
            ><i class="fa-solid fa-user"></i>پروفایل</a
          ><a href="settings.html" class="menu-item"
            ><i class="fa-solid fa-gear"></i>تنظیمات</a
          >
          <div class="sidebar-divider"></div>
          <a href="/downloads.html" class="menu-item"
            ><i class="fa-solid fa-globe"></i>صفحه دانلودها</a
          ><a href="#" data-logout class="menu-item logout"
            ><i class="fa-solid fa-right-from-bracket"></i>خروج</a
          >
        </div>
      </aside>
      <main class="main-content" id="mainContent">
        <div class="page-header">
          <h1>مدیریت فایل‌های دانلود</h1>
          <p>
            جزوه، PDF، فایل صوتی یا منابع آموزشی را برای پایه و موضوع دلخواه
            آپلود یا حذف کنید.
          </p>
        </div>
        <div class="admin-page-card mb-4">
          <form id="fileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">عنوان فایل</label
                ><input id="fileTitle" class="form-control" required />
              </div>
              <div class="col-md-3">
                <label class="form-label">پایه</label
                ><select id="fileGrade" class="form-select">
                  <option value="">همه/عمومی</option>
                  <option value="grade-7">هفتم</option>
                  <option value="grade-8">هشتم</option>
                  <option value="grade-9">نهم</option>
                  <option value="grade-10">دهم</option>
                  <option value="grade-11">یازدهم</option>
                  <option value="grade-12">دوازدهم</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">موضوع</label
                ><select id="fileCategory" class="form-select">
                  <option value="reading">Reading</option>
                  <option value="listening">Listening</option>
                  <option value="speaking">Speaking</option>
                  <option value="writing">Writing</option>
                  <option value="others">سایر</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">فایل</label
                ><input
                  id="fileInput"
                  type="file"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <button class="btn btn-dark mt-3">آپلود فایل</button>
            <div id="fileResult" class="small mt-2"></div>
          </form>
        </div>
        <div class="admin-page-card">
          <h5>فایل‌های آپلودشده</h5>
          <div id="filesList" class="mt-3"></div>
        </div>
      </main>
    </div>
    <script src="js/admin.js"></script>
    <script src="js/downloads-manage.js"></script>
  </body>
</html>
