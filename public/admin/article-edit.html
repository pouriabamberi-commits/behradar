<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ویرایش مقاله</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="css/admin.css" />
    <style>
      .article-create-container {
        max-width: 1000px;
        margin: 0 auto;
        padding: 35px 20px;
      }
      .article-create-card {
        background: #fff;
        border: 1px solid #e9eaed;
        border-radius: 12px;
        padding: 24px;
      }
      .article-create-header {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        margin-bottom: 25px;
      }
      .form-section {
        padding: 20px 0;
        border-bottom: 1px solid #eee;
      }
      .form-section:last-child {
        border: 0;
      }
      .form-section h5 {
        font-size: 15px;
        margin-bottom: 18px;
      }
      .article-builder-block {
        border: 1px solid #e1e3e6;
        border-radius: 10px;
        padding: 15px;
        background: #fafafa;
        margin-bottom: 12px;
      }
      .article-form-actions {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-top: 20px;
      }
    </style>
  </head>
  <body class="article-create-page">
    <main class="article-create-container">
      <div class="article-create-header">
        <div>
          <h1><i class="fas fa-pen-to-square"></i> ویرایش مقاله</h1>
          <p>
            مقاله با ساختار بلوکی در SQLite ذخیره می‌شود و در وبلاگ همان قالب
            سایت را می‌گیرد.
          </p>
        </div>
        <a href="articles.html" class="btn btn-outline-secondary">بازگشت</a>
      </div>
      <div class="article-create-card">
        <form id="articleCreateForm" enctype="multipart/form-data">
          <div class="form-section">
            <h5><i class="fas fa-circle-info"></i> اطلاعات اصلی</h5>
            <div class="mb-3">
              <label class="form-label">عنوان اصلی مقاله</label
              ><input id="articleTitle" class="form-control" required />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">دسته‌بندی</label
                ><select id="articleCategory" class="form-select" required>
                  <option value="grammar">گرامر</option>
                  <option value="vocabulary">لغات</option>
                  <option value="conversation">مکالمه</option>
                  <option value="listening">Listening</option>
                  <option value="general">آموزش عمومی</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">وضعیت</label
                ><select id="articleStatus" class="form-select">
                  <option value="published">انتشار</option>
                  <option value="draft">پیش‌نویس</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">حوزه کاری نویسنده</label
                ><input
                  id="authorJob"
                  class="form-control"
                  placeholder="مثلاً مدرس ارشد آیلتس و مکالمه"
                />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">زمان مطالعه</label
                ><input id="readingTime" class="form-control" value="۵ دقیقه" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">برچسب‌ها</label
              ><input
                id="articleTags"
                class="form-control"
                placeholder="گرامر, آیلتس, مکالمه"
              />
            </div>
          </div>
          <div class="form-section">
            <h5><i class="fas fa-align-right"></i> خلاصه مقاله</h5>
            <textarea
              id="articleSummary"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>
          <div class="form-section">
            <h5><i class="fas fa-layer-group"></i> ساختار مقاله</h5>
            <p class="small-muted">
              هر بخش را جداگانه بساز. ترتیب بلوک‌ها دقیقاً همان ترتیب نمایش در
              صفحه مقاله خواهد بود.
            </p>
            <div id="articleBlocks"></div>
            <div class="d-flex flex-wrap gap-2">
              <button
                type="button"
                class="btn btn-outline-dark"
                data-add="paragraph"
              >
                + پاراگراف</button
              ><button
                type="button"
                class="btn btn-outline-dark"
                data-add="heading"
              >
                + تیتر فرعی</button
              ><button
                type="button"
                class="btn btn-outline-dark"
                data-add="highlight"
              >
                + نکته مهم</button
              ><button
                type="button"
                class="btn btn-outline-dark"
                data-add="list"
              >
                + لیست شماره‌دار
              </button>
            </div>
          </div>
          <div class="form-section">
            <h5><i class="fas fa-image"></i> تصویر شاخص</h5>
            <input
              type="file"
              id="articleImage"
              class="form-control"
              accept="image/png,image/jpeg,image/webp,image/gif"
            />
            <div class="form-text">حداکثر ۱۵ مگابایت.</div>
          </div>
          <div class="article-form-actions">
            <a href="articles.html" class="btn btn-light">انصراف</a
            ><button class="btn btn-dark" type="submit">
              <i class="fas fa-save"></i> ذخیره مقاله
            </button>
          </div>
        </form>
      </div>
    </main>
    <script src="js/admin.js"></script>
    <script src="js/article-edit.js"></script>
  </body>
</html>
