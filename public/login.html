<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود / ثبت‌نام | استاد بهمن بهرادفر</title>
    <meta name="description" content="ورود و نام‌نویسی سریع در آکادمی زبان انگلیسی استاد بهمن بهرادفر">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="ورود و ثبت‌نام | استاد بهمن بهرادفر">
    <meta property="og:description" content="ورود به حساب کاربری و دسترسی به دوره ها و منابع آموزشی زبان انگلیسی.">
    <meta property="og:type" content="website">

    <!-- Vazirmatn Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        primary: '#F6AE2D',
                        'primary-hover': '#F59C28',
                        accent: '#F48923',
                        highlight: '#F3771E',
                        'dark-accent': '#F26419',
                    }
                }
            }
        }
    </script>

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        /* استایل اختصاصی برای خطا‌های JustValidate */
        .just-validate-error-label {
            color: #ef4444 !important;
            font-size: 0.75rem !important;
            margin-top: 0.375rem !important;
            display: block !important;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 group" title="صفحه اصلی استاد بهمن بهرادفر">
                <div
                    class="w-12 h-12 rounded-xl bg-gradient-to-tr from-dark-accent to-primary flex items-center justify-center text-white font-black text-xl shadow-md shadow-accent/20 group-hover:scale-105 transition-transform">
                    BB
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg text-slate-900 group-hover:text-dark-accent transition-colors">استاد
                        بهمن بهرادفر</span>
                    <span class="text-xs text-slate-500">آکادمی تخصصی آموزش زبان انگلیسی</span>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-8 font-medium text-slate-600 text-sm">
                <a href="#" class="hover:text-dark-accent transition-colors">صفحه اصلی</a>
                <a href="#" class="hover:text-dark-accent transition-colors">درباره من</a>
                <a href="#" class="hover:text-dark-accent transition-colors">تعیین سطح</a>
                <a href="#" class="hover:text-dark-accent transition-colors">وبلاگ</a>
                <a href="#" class="hover:text-dark-accent transition-colors">دانلودها</a>
            </nav>

            <div>
                <a href="#"
                    class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-dark-accent hover:bg-highlight text-white text-sm font-semibold transition-all shadow-md shadow-dark-accent/20 hover:shadow-lg">
                    ورود / ثبت‌نام
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md bg-white rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/60 border border-slate-100"
            data-aos="zoom-in">

            <!-- Title Header -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-primary/10 flex items-center justify-center text-dark-accent">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 mb-2">ورود / ثبت‌نام</h1>
                <p class="text-xs text-slate-500" id="stepDescription">برای ورود یا عضویت، مشخصات خود را وارد کنید</p>
            </div>

            <!-- Form -->
            <form id="authForm" novalidate class="space-y-5">

                <!-- Step 1 Inputs -->
                <div id="step1Container" class="space-y-5">
                    <!-- Full Name Input -->
                    <div>
                        <label for="fullName" class="block text-xs font-bold text-slate-700 mb-2">نام و نام
                            خانوادگی</label>
                        <input type="text" id="fullName" name="fullName" placeholder="مثال: علی محمدی"
                            class="w-full h-12 px-4 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-dark-accent focus:ring-4 focus:ring-primary/20 text-slate-800 text-sm transition-all outline-none">
                    </div>

                    <!-- Phone Number Input -->
                    <div>
                        <label for="phoneNumber" class="block text-xs font-bold text-slate-700 mb-2">شماره
                            موبایل</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="۰۹۱۲۳۴۵۶۷۸۹" dir="ltr"
                            class="w-full h-12 px-4 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-dark-accent focus:ring-4 focus:ring-primary/20 text-slate-800 text-sm text-right transition-all outline-none">
                    </div>
                    <!-- go to login password -->
                    <div>
                        <a href="./password-login.html" class="text-sm text-orange-800 underline hover:no-underline"> ورود با رمز عبور </a>
                    </div>

                    <!-- Submit Button Step 1 -->
                    <button type="submit" id="btnSendCode"
                        class="w-full h-12 rounded-xl bg-dark-accent hover:bg-highlight text-white text-sm font-bold transition-all shadow-md shadow-dark-accent/20 hover:shadow-lg flex items-center justify-center gap-2">
                        <span>ارسال کد تایید</span>
                        <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M14 5l7 7m0 0l-7 7m7-7H3" />
                        </svg>
                    </button>
                </div>

                <!-- Step 2 Inputs (Hidden by default) -->
                <div id="step2Container" class="hidden space-y-5 pt-2 border-t border-slate-100">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label for="otpCode" class="block text-xs font-bold text-slate-700">کد تایید
                                ارسال‌شده</label>
                            <button type="button" id="btnEditInfo"
                                class="text-[11px] font-bold text-dark-accent hover:underline">ویرایش اطلاعات</button>
                        </div>
                        <input type="text" id="otpCode" name="otpCode" placeholder="- - - - - -" maxlength="6" dir="ltr"
                            class="w-full h-12 px-4 text-center tracking-widest font-bold text-lg rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-dark-accent focus:ring-4 focus:ring-primary/20 text-slate-800 transition-all outline-none">
                    </div>

                    <!-- Confirm Button Step 2 -->
                    <button type="button" id="btnVerifyCode"
                        class="w-full h-12 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold transition-all shadow-md shadow-emerald-600/20 hover:shadow-lg">
                        تایید و ورود به حساب
                    </button>
                </div>

            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs text-center">
        <div class="max-w-7xl mx-auto px-4">
            <p>کلیه حقوق مادی و معنوی این وب‌سایت متعلق به **استاد بهمن بهرادفر** می‌باشد.</p>
        </div>
    </footer>

    <!-- JS Libraries -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>

    <!-- Page Logic -->
    <script>
        AOS.init({ duration: 800, once: true });

        const form = document.querySelector('#authForm');
        const step1Container = document.getElementById('step1Container');
        const step2Container = document.getElementById('step2Container');
        const stepDescription = document.getElementById('stepDescription');
        const btnEditInfo = document.getElementById('btnEditInfo');
        const btnVerifyCode = document.getElementById('btnVerifyCode');
        const otpInput = document.getElementById('otpCode');

        // پیکربندی JustValidate
        const validator = new JustValidate('#authForm', {
            errorFieldCssClass: 'border-red-500',
            errorLabelCssClass: 'just-validate-error-label',
            focusInvalidField: true,
            lockForm: true,
        });

        validator
            .addField('#fullName', [
                {
                    rule: 'required',
                    errorMessage: 'لطفاً نام و نام خانوادگی خود را وارد کنید.',
                },
                {
                    rule: 'minLength',
                    value: 3,
                    errorMessage: 'نام باید حداقل شامل ۳ حرف باشد.',
                },
            ])
            .addField('#phoneNumber', [
                {
                    rule: 'required',
                    errorMessage: 'لطفاً شماره موبایل خود را وارد کنید.',
                },
                {
                    rule: 'customRegexp',
                    value: /^09\d{9}$/,
                    errorMessage: 'شماره موبایل وارد شده معتبر نیست (مثال: 09123456789).',
                },
            ])
            .onSuccess((event) => {
                // مرحله اول: ارسال موفقیت‌آمیز کد تایید
                Swal.fire({
                    title: 'در حال ارسال کد...',
                    text: 'لطفاً چند لحظه شکیبا باشید.',
                    icon: 'info',
                    showConfirmButton: false,
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                        setTimeout(() => {
                            Swal.fire({
                                icon: 'success',
                                title: 'کد تایید ارسال شد',
                                text: 'کد ۶ رقمی تایید به شماره موبایل شما پیامک گردید.',
                                confirmButtonText: 'متوجه شدم',
                                confirmButtonColor: '#F26419'
                            });

                            // نمایش باکس مرحله دوم (کد OTP)
                            step1Container.classList.add('opacity-60', 'pointer-events-none');
                            step2Container.classList.remove('hidden');
                            stepDescription.innerText = 'کد ارسال شده به شماره خود را در باکس زیر وارد کنید';
                            otpInput.focus();
                        }, 1200);
                    }
                });
            });

        // بازگشت به مرحله اول (ویرایش اطلاعات)
        btnEditInfo.addEventListener('click', () => {
            step1Container.classList.remove('opacity-60', 'pointer-events-none');
            step2Container.classList.add('hidden');
            stepDescription.innerText = 'برای ورود یا عضویت، مشخصات خود را وارد کنید';
            otpInput.value = '';
        });

        // دکمه تایید نهایی کد OTP
        btnVerifyCode.addEventListener('click', () => {
            const val = otpInput.value.trim();
            if (!val || val.length < 4) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطا در ورود کد',
                    text: 'لطفاً کد تایید را به صورت کامل وارد کنید.',
                    confirmButtonText: 'تلاش مجدد',
                    confirmButtonColor: '#F26419'
                });
                return;
            }

            Swal.fire({
                title: 'در حال اعتبارسنجی...',
                icon: 'info',
                showConfirmButton: false,
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                    setTimeout(() => {
                        Swal.fire({
                            icon: 'success',
                            title: 'ورود با موفقیت انجام شد',
                            text: 'خوش آمدید! در حال انتقال به پنل کاربری...',
                            timer: 2000,
                            showConfirmButton: false
                        });
                    }, 1000);
                }
            });
        });
    </script>
</body>

</html>
