<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود با رمز عبور | استاد بهمن بهرادفر</title>
    <meta name="description"
        content="ورود به حساب کاربری با استفاده از رمز عبور در آکادمی زبان انگلیسی استاد بهمن بهرادفر">

    <!-- Open Graph Tags -->
    <meta property="og:title" content="ورود با رمز عبور | استاد بهمن بهرادفر">
    <meta property="og:description" content="ورود به حساب کاربری و دسترسی به دوره‌ها و منابع آموزشی زبان انگلیسی.">
    <meta property="og:type" content="website">

    <!-- Vazirmatn Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.3/Vazirmatn-font-face.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                    },
                    colors: {
                        primary: '#F6AE2D',
                        'primary-hover': '#F59C28',
                        accent: '#F48923',
                        highlight: '#F3771E',
                        'dark-accent': '#F26419',
                    }
                }
            }
        }
    </script>

    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        .just-validate-error-label {
            color: #ef4444 !important;
            font-size: 0.75rem !important;
            margin-top: 0.375rem !important;
            display: block !important;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center gap-3 group" title="صفحه اصلی استاد بهمن بهرادفر">
                <div
                    class="w-12 h-12 rounded-xl bg-gradient-to-tr from-dark-accent to-primary flex items-center justify-center text-white font-black text-xl shadow-md shadow-accent/20 group-hover:scale-105 transition-transform">
                    BB
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg text-slate-900 group-hover:text-dark-accent transition-colors">استاد
                        بهمن بهرادفر</span>
                    <span class="text-xs text-slate-500">آکادمی تخصصی آموزش زبان انگلیسی</span>
                </div>
            </a>

            <nav class="hidden md:flex items-center gap-8 font-medium text-slate-600 text-sm">
                <a href="#" class="hover:text-dark-accent transition-colors">صفحه اصلی</a>
                <a href="#" class="hover:text-dark-accent transition-colors">درباره من</a>
                <a href="#" class="hover:text-dark-accent transition-colors">تعیین سطح</a>
                <a href="#" class="hover:text-dark-accent transition-colors">وبلاگ</a>
                <a href="#" class="hover:text-dark-accent transition-colors">دانلودها</a>
            </nav>

            <div>
                <a href="#"
                    class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-dark-accent hover:bg-highlight text-white text-sm font-semibold transition-all shadow-md shadow-dark-accent/20 hover:shadow-lg">
                    ورود / ثبت‌نام
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md bg-white rounded-3xl p-8 sm:p-10 shadow-xl shadow-slate-200/60 border border-slate-100"
            data-aos="zoom-in">

            <!-- Title Header -->
            <div class="text-center mb-8">
                <div
                    class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-primary/10 flex items-center justify-center text-dark-accent">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 mb-2">ورود با رمز عبور</h1>
                <p class="text-xs text-slate-500">مشخصات حساب کاربری خود را وارد کنید</p>
            </div>

            <!-- Form -->
            <form id="loginPasswordForm" novalidate class="space-y-5">

                <!-- Full Name / User ID Input -->
                <div>
                    <label for="fullName" class="block text-xs font-bold text-slate-700 mb-2">نام و نام خانوادگی یا
                        شماره موبایل</label>
                    <input type="text" id="fullName" name="fullName" placeholder="مثال: علی محمدی یا ۰۹۱۲۳۴۵۶۷۸۹"
                        class="w-full h-12 px-4 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-dark-accent focus:ring-4 focus:ring-primary/20 text-slate-800 text-sm transition-all outline-none">
                </div>

                <!-- Password Input -->
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label for="password" class="block text-xs font-bold text-slate-700">رمز عبور</label>
                        <a href="./login.html" class="text-[11px] font-bold text-dark-accent hover:underline">فراموشی رمز عبور؟</a>
                    </div>
                    <div class="relative">
                        <input type="password" id="password" name="password" placeholder="••••••••" dir="ltr"
                            class="w-full h-12 pl-4 pr-11 rounded-xl bg-slate-50 border border-slate-200 focus:bg-white focus:border-dark-accent focus:ring-4 focus:ring-primary/20 text-slate-800 text-sm text-right transition-all outline-none">

                        <!-- Toggle Password Button -->
                        <button type="button" id="togglePasswordBtn"
                            class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full h-12 rounded-xl bg-dark-accent hover:bg-highlight text-white text-sm font-bold transition-all shadow-md shadow-dark-accent/20 hover:shadow-lg flex items-center justify-center gap-2">
                    <span>ورود به حساب</span>
                    <svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>

            </form>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs text-center">
        <div class="max-w-7xl mx-auto px-4">
            <p>کلیه حقوق مادی و معنوی این وب‌سایت متعلق به **استاد بهمن بهرادفر** می‌باشد.</p>
        </div>
    </footer>

    <!-- JS Libraries -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>

    <!-- Page Logic -->
    <script>
        AOS.init({ duration: 800, once: true });

        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        // قابلیت نمایش/پنهان‌سازی رمز عبور
        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

            eyeIcon.innerHTML = isPassword
                ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a8.959 8.959 0 012.122-.183c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21M3 3l18 18"/>`
                : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>`;
        });

        // اعتبارسنجی فرم با JustValidate
        const validator = new JustValidate('#loginPasswordForm', {
            errorFieldCssClass: 'border-red-500',
            errorLabelCssClass: 'just-validate-error-label',
            focusInvalidField: true,
            lockForm: true,
        });

        validator
            .addField('#fullName', [
                {
                    rule: 'required',
                    errorMessage: 'لطفاً نام یا شماره موبایل خود را وارد کنید.',
                },
                {
                    rule: 'minLength',
                    value: 3,
                    errorMessage: 'ورودی باید حداقل شامل ۳ کاراکتر باشد.',
                },
            ])
            .addField('#password', [
                {
                    rule: 'required',
                    errorMessage: 'لطفاً رمز عبور خود را وارد کنید.',
                },
                {
                    rule: 'minLength',
                    value: 6,
                    errorMessage: 'رمز عبور باید حداقل ۶ کاراکتر باشد.',
                },
            ])
            .onSuccess((event) => {
                Swal.fire({
                    title: 'در حال بررسی اطلاعات...',
                    text: 'لطفاً چند لحظه شکیبا باشید.',
                    icon: 'info',
                    showConfirmButton: false,
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                        setTimeout(() => {
                            Swal.fire({
                                icon: 'success',
                                title: 'ورود موفقیت‌آمیز',
                                text: 'خوش آمدید! در حال انتقال به پنل کاربری...',
                                timer: 2000,
                                showConfirmButton: false
                            });
                        }, 1200);
                    }
                });
            });
    </script>
</body>

</html>
